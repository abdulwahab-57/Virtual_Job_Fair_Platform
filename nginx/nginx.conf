upstream rails_app {
  server rails-app:3000;
}

server {
  listen 80;

  # Client upload limit (for profile pictures, PDFs, etc.)
  client_max_body_size 20M;

  # Serve the maintenance page when the Rails container is unreachable
  error_page 502 503 504 /maintenance.html;
  location = /maintenance.html {
    root /usr/share/nginx/html;
    internal;
  }

  # Proxy everything else to Puma
  location / {
    proxy_pass         http://rails_app;
    proxy_http_version 1.1;

    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Generous timeouts for long-running requests (PDF generation, Zoom, etc.)
    proxy_read_timeout    300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
  }
}
