name: Build, Push, and Deploy Rails App

on:
  push:
    branches:
      - cleanup/v1

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Hub Login
        run: echo ${{ secrets.DOCKERHUB_PASSWORD }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build image
        run: |
          docker build -t wahab457/virtual_job_fair_platform:latest .

      - name: Push image to Docker Hub
        run: |
          docker push wahab457/virtual_job_fair_platform:latest

      - name: Copy config files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "docker-compose.yaml,nginx/"
          target: "/home/jobfair/"

      - name: Deploy to Remote Server via SSH (Blue-Green)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            cd /home/jobfair/

            # 0. Persist secrets in .env so any manual docker compose command
            #    on the server works without needing inline env vars every time.
            #    Docker Compose reads .env automatically from the project directory.
            echo "RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}" > .env

            # 1. Pull the new image
            docker pull wahab457/virtual_job_fair_platform:latest

            # 1b. Recreate Nginx only if the config changed.
            #     SCP replaces nginx.conf on disk (new inode); Docker bind mounts track
            #     the old inode, so nginx -s reload won't see the update. We compare
            #     what's live inside the container against the newly SCP'd host file —
            #     recreate only when they differ, avoiding unnecessary ~2s downtime.
            if ! docker exec virtual_job_fair_platform_production-nginx-1 \
                 diff /etc/nginx/conf.d/default.conf /home/jobfair/nginx/nginx.conf \
                 > /dev/null 2>&1; then
              echo "Nginx config changed — recreating container."
              docker compose up -d --no-deps --force-recreate nginx
            else
              echo "Nginx config unchanged — skipping recreate."
            fi

            # 2. Ensure Postgres and Redis are running — leave them untouched
            RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }} docker compose up -d --no-recreate postgres redis

            # 3. Start the NEW Rails container alongside the old one under a temporary name.
            #    It joins the same Docker network so Nginx can reach it.
            docker run -d \
              --name rails-app-green \
              --network virtual_job_fair_platform_production_default \
              -e RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }} \
              -e DB_HOST=postgres \
              -v rails-storage:/rails/storage \
              wahab457/virtual_job_fair_platform:latest

            # 4. Wait for the new container to pass its health check (/up endpoint).
            #    Retries every 5 seconds for up to 2 minutes.
            echo "Waiting for new container to be healthy..."
            for i in $(seq 1 24); do
              if docker exec rails-app-green curl -sf http://localhost:3000/up > /dev/null 2>&1; then
                echo "New container is healthy after $((i * 5)) seconds."
                break
              fi
              if [ $i -eq 24 ]; then
                echo "New container failed health check. Aborting deploy."
                docker stop rails-app-green && docker rm rails-app-green
                exit 1
              fi
              echo "Not ready yet, retrying in 5 seconds... ($i/24)"
              sleep 5
            done

            # 5. Switch Nginx upstream to the new container (zero dropped requests).
            #    nginx -s reload is graceful — it finishes in-flight requests on old
            #    workers before handing off to new ones.
            docker exec virtual_job_fair_platform_production-nginx-1 \
              sh -c 'sed -i "s/server rails-app:3000/server rails-app-green:3000/" /etc/nginx/conf.d/default.conf && nginx -s reload'

            # 6. Stop and remove the OLD Rails container — Nginx is already off it
            docker compose stop rails-app
            docker compose rm -f rails-app

            # 7. Bring a fresh rails-app container up under Compose management
            RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }} docker compose up -d --no-deps rails-app

            # 8. Wait for the Compose-managed container to be healthy
            echo "Waiting for rails-app to be healthy..."
            for i in $(seq 1 24); do
              if docker exec virtual_job_fair_platform_production-rails-app-1 curl -sf http://localhost:3000/up > /dev/null 2>&1; then
                echo "rails-app is healthy."
                break
              fi
              if [ $i -eq 24 ]; then
                echo "rails-app failed health check after green swap. Investigate manually."
                exit 1
              fi
              sleep 5
            done

            # 9. Switch Nginx back to the standard rails-app service name and reload
            docker exec virtual_job_fair_platform_production-nginx-1 \
              sh -c 'sed -i "s/server rails-app-green:3000/server rails-app:3000/" /etc/nginx/conf.d/default.conf && nginx -s reload'

            # 10. Remove the green container and clean up old images
            docker stop rails-app-green && docker rm rails-app-green
            docker image prune -f
